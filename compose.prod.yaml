services:
  api:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=db_admin
      # TODO: samakan dengan MARIADB_PASSWORD di service mysql
      - DB_PASSWORD=CHANGE_ME
      - DB_NAME=sgeinventorydb_main
    ports:
      # HTTPS/TLS tidak ditangani di compose ini; pasang reverse proxy di server
      # atau gunakan Cloudflare di depan port ini.
      - "${API_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mariadb:11.8.2
    restart: unless-stopped
    environment:
      # TODO: ganti CHANGE_ME dengan password produksi
      MARIADB_ROOT_PASSWORD: CHANGE_ME
      MARIADB_DATABASE: sgeinventorydb_main
      MARIADB_USER: db_admin
      MARIADB_PASSWORD: CHANGE_ME
    # Port DB sengaja tidak dipublish ke host; hanya bisa diakses antar-container.
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/prod/mariadb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      # Hanya bisa diakses dari server itu sendiri (gunakan SSH tunnel).
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mariadb_data:
