services:
  api:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    restart: unless-stopped
    environment:
      # production: tabel tetap dibuat otomatis (Migrate), tetapi akun awal (Seed) tidak dibuat
      - APP_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=db_admin
      # TODO: samakan dengan POSTGRES_PASSWORD di service db
      - DB_PASSWORD=CHANGE_ME
      - DB_NAME=sgeinventorydb_main
      # TODO: ganti dengan string acak minimal 32 karakter (mis. hasil `openssl rand -hex 32`)
      - JWT_SECRET=CHANGE_ME
      # TODO: isi dengan domain FE produksi, pisahkan dengan koma
      - CORS_ORIGINS=https://CHANGE_ME
    ports:
      # HTTPS/TLS tidak ditangani di compose ini; pasang reverse proxy di server
      # atau gunakan Cloudflare di depan port ini.
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_admin
      # TODO: ganti CHANGE_ME dengan password produksi
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: sgeinventorydb_main
    # Port DB sengaja tidak dipublish ke host; hanya bisa diakses antar-container.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d sgeinventorydb_main"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      # TODO: ganti dengan email & password login pgAdmin produksi
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: CHANGE_ME
    ports:
      # Hanya bisa diakses dari server itu sendiri (gunakan SSH tunnel).
      - "127.0.0.1:${PGADMIN_PORT:-8081}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
