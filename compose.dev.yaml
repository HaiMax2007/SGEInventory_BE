services:
  api:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    restart: unless-stopped
    environment:
      # development: app menjalankan Seed (membuat akun awal Max & Raka)
      - APP_ENV=development
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Secret khusus development (bukan rahasia); produksi wajib memakai nilai lain
      - JWT_SECRET=${JWT_SECRET}
      # Alamat FE yang boleh memanggil API, pisahkan dengan koma
      - CORS_ORIGINS=${CORS_ORIGINS}
    ports:
      - "${PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # POSTGRES_USER otomatis menjadi superuser; tidak ada root password terpisah seperti MariaDB
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 5433 di host agar tidak bentrok dengan PostgreSQL lokal (5432)
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Postgres 18 menyimpan data di /var/lib/postgresql/<versi>, jadi yang di-mount folder induknya
      - postgres_data:/var/lib/postgresql
      # Tabel tidak dibuat dari file SQL lagi, melainkan oleh API (database.Migrate) setiap kali start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d sgeinventorydb_main"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Mode desktop: pgAdmin langsung terbuka tanpa halaman login (khusus development)
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Daftar server yang otomatis muncul di pgAdmin (dibaca saat pertama kali dijalankan)
      - ./docker/dev/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
