services:
  api:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
    depends_on:
      - mysql
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sge.rule=Host(`sge.localhost`)"
      - "traefik.http.routers.sge.entrypoints=web"
      - "traefik.http.services.sge.loadbalancer.server.port=3000"
    networks:
      - internal
      - proxy
      - shared-api

  mysql:
    image: mariadb:11.8.2
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sgeinventorydb_main
      MARIADB_USER: db_admin
      MARIADB_PASSWORD: db_admin
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/dev/mariadb:/docker-entrypoint-initdb.d
    networks:
      - internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma_sge.rule=Host(`vpanel.sge.localhost`)"
      - "traefik.http.routers.pma_sge.entrypoints=web"
      - "traefik.http.services.pma_sge.loadbalancer.server.port=80"
    environment:
      PMA_HOST: mysql
      PMA_USER: db_admin
      PMA_PASSWORD: db_admin
    depends_on:
      - mysql
    networks:
      - internal
      - proxy

volumes:
  mariadb_data:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
  shared-api:
    external: true
    